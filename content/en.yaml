  - it: Lookbook MonPiz — Collezione Inverno
    en: MonPiz Lookbook — Winter Collection
  - it: "Pedule urban fashion, made in Italy"
    en: "Urban fashion hiking boots, made in Italy"
  - it: "Una storia italiana. Qualità ed eccellenza che si guardano, si toccano e si indossano."
    en: "An Italian story. Quality and excellence you can see, touch and wear."
  - it: Collezione F.W.2026/2027
