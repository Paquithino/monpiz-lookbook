  # Modelli e prodotti ##############################################################################
  - it: "Un classico della montagna, riletto oggi. L'apertura a soffietto rende la calzata più facile e offre una maggiore protezione, mentre le linee vintage restano attuali anche in città."
    en: "A mountain classic, reinterpreted for today. The bellows tongue makes the boot easier to put on and gives more protection, while its vintage lines still feel current in the city."
  - it: Cortina Pelle Martellata
    en: Cortina Pebbled Leather
  - it: Falcade Pelle Martellata
    en: Falcade Pebbled Leather
  - it: Falcade Cavallino
    en: Falcade Pony Hair
  - it: Anfibio Stringato
    en: Lace-up Combat Boot
  - it: "Una pelle dalla grana pronunciata, morbida al tatto e dall'aspetto naturale. Versatile e resistente, mantiene nel tempo la forma e l'intensità del colore."
    en: "A leather with a pronounced grain, soft to the touch and natural in appearance. Versatile and hard-wearing, it keeps its shape and the depth of its colour over time."
  - it: "La pelle Dakar è un cuoio bovino di prima scelta, lavorato con oli, cere e grassi per un effetto vintage dall'aspetto naturale. Con l'uso si schiarisce in velature morbide e sviluppa una patina unica per ogni paio."
    en: "Dakar is a top-grade cowhide worked with oils, waxes and fats for a natural, vintage look. With wear it lightens in soft shades and develops a patina unique to every pair."
  - it: "Il suede è la pelle scamosciata, una superficie morbida, vellutata e leggermente ruvida al tatto, che dà alla pedula un carattere caldo e raffinato."
    en: "Suede is brushed leather: a soft, velvety surface, slightly rough to the touch, that gives the boot a warm and refined character."
  - it: "Apertura classica della linguetta, per una calzata essenziale e senza tempo. Struttura solida e confortevole, per tutti i giorni tra città e natura."
    en: "A classic open tongue for a clean, timeless fit. Solid and comfortable, for every day between city and nature."
  - it: "Pelle cavallino, texture ricercata e carattere deciso."
    en: "Pony-hair leather: a refined texture with a bold character."
  - it: "Una pedula bassa con occhielli in metallo e suola Vibram dal fondo scuro, leggera come una scarpa sportiva. Cavallino, suede in due colori, puntale in gomma e una bordatura in gomma porosa effetto roccia."
    en: "A low boot with metal eyelets and a dark Vibram sole, as light as a sneaker. Pony hair, two-tone suede, a rubber toe cap and a porous rubber rand with a rock effect."
  - it: "Tre varianti di cavallino tra cui scegliere, per adattare la pedula al proprio stile dal camouflage al moka, fino al bianco e nero."
    en: "Three pony-hair options to choose from, to match the boot to your style: from camouflage to moka, to black and white."
  - it: "La pedula che sceglie di distinguersi. Una base in cavallino gocciato, rifinita da bordatura e inserti in pelle Dakar, per un carattere che non passa inosservato."
    en: "The boot that chooses to stand out. A spotted pony-hair base, finished with a rand and inserts in Dakar leather, for a character that never goes unnoticed."
  - it: "Disponibile in due varianti di cavallino: moka, calda e avvolgente, oppure bianco e nero, per un contrasto più deciso."
    en: "Available in two pony-hair options: moka, warm and enveloping, or black and white, for a bolder contrast."
  - it: "La novità di MonPiz: una scarpa diversa da tutte le altre, che nasce da un'idea tecnica e la veste di un gusto fashion, senza rinunciare alla comodità."
    en: "New from MonPiz: a shoe unlike any other, born from a technical idea and dressed with a fashion sensibility, without giving up comfort."
  - it: "Lo stile MonPiz, senza lacci. Un beatle in cavallino con due bande elastiche laterali che lo rendono comodo da infilare, su una suola Vibram."
    en: "MonPiz style, without laces. A pony-hair Beatle boot with two elastic side panels that make it easy to slip on, on a Vibram sole."
  - it: "Completamente diverso, pensato per chi osa. L'anfibio stringato MonPiz porta il cavallino e la suola Vibram fuori da ogni schema, con una zip laterale per una calzata comoda e immediata."
    en: "Completely different, made for those who dare. The MonPiz lace-up combat boot takes pony hair and the Vibram sole beyond every convention, with a side zip for a quick, comfortable fit."
  - it: "Suede trattato a mano per dare un aspetto vissuto, come se avesse già una storia. Ogni paio è diverso dall'altro: è questo a renderlo unico."
    en: "Hand-treated suede with a worn-in look, as if it already had a story. No two pairs are alike: that is what makes it unique."
  - it: "Il suede incontra la gomma. La bordatura protegge la tomaia e regala alla pedula un'immagine più grintosa e accattivante."
    en: "Suede meets rubber. The rand protects the upper and gives the boot a bolder, more striking look."
  - it: Disponibile in tutte le varianti colori del suede.
    en: Available in every suede colour.
  - it: "Pedula in nabuk, una pelle pregiata ricavata dal lato fiore, la parte più esterna e compatta. Levigata finemente fino a diventare vellutata, morbida e calda al tatto, è più robusta e duratura dello scamosciato."
    en: "A boot in nubuck, a fine leather taken from the grain side, its outermost and most compact layer. Finely buffed until velvety, soft and warm to the touch, it is sturdier and longer-lasting than suede."
  - it: "Una pedula bassa con occhielli in metallo e suola Vibram dal fondo scuro, leggera come una scarpa sportiva. Nabuk suede in due colori, puntale in gomma e una bordatura in gomma porosa effetto roccia."
    en: "A low boot with metal eyelets and a dark Vibram sole, as light as a sneaker. Two-tone nubuck suede, a rubber toe cap and a porous rubber rand with a rock effect."
  - it: "Volutamente diversa, per chi ama la montagna sul serio. Un calzetto waterproof si stringe con un laccetto di chiusura, su una suola Vibram pronta a ogni terreno."
    en: "Deliberately different, for those who take the mountains seriously. A waterproof inner sock tightens with a drawcord, on a Vibram sole ready for any terrain."
  - it: "La City di MonPiz, pensata per il massimo comfort. Ben ammortizzata, con plantare in memory foam e l'immancabile suola Vibram. Nata per chi ama la pedula MonPiz e cerca un modello da città."
    en: "The MonPiz City, designed for maximum comfort. Well cushioned, with a memory foam insole and the signature Vibram sole. Made for those who love the MonPiz boot and want a model for the city."
  - it: Disponibile in tre colori di Suede.
    en: Available in three suede colours.

