  - it: Come nasce MonPiz
    en: How MonPiz began
  - it: Tra tradizione ed innovazione
    en: Between tradition and innovation
  - it: "MonPiz — Montebelluna, Italia"
    en: "MonPiz — Montebelluna, Italy"
  - it: "Negli anni ’50, Montebelluna, un comune in provincia di Treviso, è diventato un centro di eccellenza per la produzione di calzature tecniche. Le pedule, scarpe progettate per il trekking e l’escursionismo, sono nate qui grazie all’abilità e alla tradizione dei calzolai locali."
    en: "In the 1950s Montebelluna, a town in the province of Treviso, became a centre of excellence for technical footwear. The pedula, a boot designed for trekking and hiking, was born here, thanks to the skill and tradition of the local shoemakers."
  - it: "MonPiz coniuga tradizione artigianale e innovazione, introducendo materiali dell’eccellenza italiana e migliorando comfort e prestazioni delle pedule senza compromettere la qualità. Un twist urbano, a proprio agio su qualsiasi terreno."
    en: "MonPiz brings together craft tradition and innovation, using the finest Italian materials and improving the comfort and performance of the pedula without compromising on quality. An urban twist, at ease on any terrain."
