# Contenuti del lookbook MonPiz.
# Tutti i percorsi delle immagini sono relativi alla cartella `assets/`.
# I testi accettano "\n" (o i blocchi YAML `|`) per forzare un a capo.

meta:
  title: Lookbook MonPiz — Collezione Inverno
  author: MonPiz
  subject: Pedule urban fashion, made in Italy

cover:
  tagline: Pedule urban fashion
  claim: Una storia italiana. Qualità ed eccellenza che si guardano, si toccano e si indossano.
  highlights: [Collezione F.W.2026/2027, Made in Italy, Suole Vibram]
  photo: images/products/FALCADE MARTELLATO DOPPIO LACCIO3.jpg
brand:
  eyebrow: Il marchio
  title: Tra tradizione ed innovazione
  folio: MonPiz — Montebelluna, Italia
  paragraphs:
    - >-
      Negli anni ’50, Montebelluna, un comune in provincia di Treviso, è diventato
      un centro di eccellenza per la produzione di calzature tecniche. Le pedule,
      scarpe progettate per il trekking e l’escursionismo, sono nate qui grazie
      all’abilità e alla tradizione dei calzolai locali.
    - >-
      MonPiz coniuga tradizione artigianale e innovazione, introducendo materiali
      dell’eccellenza italiana e migliorando comfort e prestazioni delle pedule
      senza compromettere la qualità. Un twist urbano, a proprio agio su qualsiasi
      terreno.
  banner:
    path: images/brand/heritage.jpg
    focus_y: 0.5
  details_title: Qualità nei dettagli
  details:
    - name: Tomaia
      description: in pelle di vitello conciato in Toscana
      image: images/details/upper.png
    - name: Fodera
      description: in pelle di vitello con lavorazione sottovuoto
      image: images/details/lining.png
    - name: Suola
      description: in gomma Vibram
      image: images/details/sole.png
    - name: Ganci e anelli
      description: in ferro con trattamento antiruggine
      image: images/details/hardware.png

# CATALOGO DONNA 
sections:
  - name: Donna
    # SEGNAPOSTO: testo provvisorio, da rivedere.
    intro: >-
      Pedule nate sulle Dolomiti, pensate per la città. Pellami conciati in
      Toscana, suole Vibram e una costruzione artigianale che dura nel tempo.
    models:
      - name: Cortina
        # SEGNAPOSTO: descrizione provvisoria, da rivedere.
        description: >-
          La pedula classica MonPiz: tomaia in pelle conciata in Toscana, fodera
          in pelle e suola Vibram.
        #Foto principale del modello
        image: images/products/Cortina.jpg
        materials:
          - name: Pelle martellata
          - name: Suede
          - name: Dakar
        products:
          - name: Cortina Pelle Martellata
            description: Pelle martellata, look raffinato e versatile.
            sizes: 36–43
            # Al massimo due varianti per pagina. Senza `image` compare il segnaposto.
            variants:
              - color: Bianco
                image: images/products/Cortina_Donna_Pelle_martellata_Bianca_spaiate.webp
              - color: Nero
                image: images/products/Cortina_Donna_Pelle_martellata_nera_spaiate.webp
          - name: Cortina Suede
            description: Suede morbido, il carattere della pedula in versione vellutata.
            sizes: 36–43
            variants:
              - color: Aneto
                image: images/products/Cortina_Donna_Aneto_spaiate.webp
          - name: Cortina Dakar
            description: Pelle Dakar dall'aspetto vissuto, calda e robusta.
            sizes: 36–43
            variants:
              - color: Testa di moro 
                image: images/products/Cortina_Donna_Dakar_Testa_di_moro_spaiate.webp  
      - name: Falcade
        # SEGNAPOSTO: descrizione provvisoria, da rivedere.
        description: >-
          Struttura solida e confortevole, per l'uso quotidiano tra città
          e natura.
        image: images/products/Falcade_Donna_Cavallino_Bianco_nera.webp
        materials:
          - name: Suede
          - name: Pelle martellata
          - name: Cavallino
        products:
          - name: Falcade Suede
            description: Suede morbido su una struttura solida, per tutti i giorni.
            sizes: 36–43
            variants:
              - color: Seminole
                image: images/products/Falcade_Donna_Seminole_Spaiate.webp
              - color: Albama
                image: images/products/Falcade_Donna_Suede_Alabama Spaiate.webp
              - color: Sabbia
                image: images/products/Falcade_Donna_Tabacco_Spaiate.webp
              - color: Saraceno
                image: images/products/Falcade_Donna_Saraceno_Spaiate.webp
          - name: Falcade Pelle Martellata 
            description: Pelle martellata, look raffinato e versatile.
            sizes: 36–43
            variants:
              - color: Bianco 
                image: images/products/Falcade_Donna_Pelle_martellata_bianca_spaiate.webp  
          - name: Falcade Cavallino
            description: Pelle cavallino, texture ricercata e carattere deciso.
            sizes: 36–43
            variants:
              - color: Bianco Nera
                image: images/products/Falcade_Donna_Cavallino_Bianco_nera_Spaiate.webp
              - color: Moka 
                image: images/products/Falcade_Donna_Cavvalino_moka_Spaiate.webp
              - color: Bianco testa di moro
                image: images/products/Falcade_Donna_Cavallino_Bianco_Testa_di_moro_Spaiate.webp      

