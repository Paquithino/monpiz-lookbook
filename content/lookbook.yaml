retailers:
   eyebrow: Dove trovarci
   title: Dove trovare MonPiz
   intro: >-
    I nostri rivenditori autorizzati, regione per regione. L’elenco completo,
    con indirizzi e mappe, è consultabile su monpiz.it.
   source: retailers.yaml

closing:
   title: Sei pronto?
   text: Scopri i nuovi prodotti MonPiz, o cerca il rivenditore più vicino a te.
   contacts:
     - [monpiz@monpiz.it, +39 335 760 4522]
     - [monpiz.it, instagram.com/monpiz_]

identity:
  logo_mask: images/brand/logo-mask.png
